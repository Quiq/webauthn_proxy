<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>WebAuthn Proxy Register</title>
        <link rel="icon" type="image/x-icon" href="/webauthn/static/favicon.ico" />
        <link href="/webauthn/static/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="/webauthn/static/css/bootstrap-icons.min.css">
    </head>
    <body>
        <!-- Theme Toggle -->
        <div class="position-fixed top-0 end-0 p-3" style="z-index: 1050;">
            <button class="btn btn-sm btn-outline-secondary" type="button" id="theme-toggle" title="Toggle theme">
                <i class="bi bi-sun-fill"></i>
            </button>
        </div>

        <!-- Main Content -->
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-7">
                    <div class="card shadow">
                        <div class="card-body">
                            <div class="text-center mb-4">
                                <img src="/webauthn/static/title-image.png" class="img-fluid" alt="WebAuthn Proxy" style="max-width: 300px;" />
                            </div>

                            <div id="errorMessages" class="alert alert-danger d-none" role="alert"></div>
                            <div id="successMessages" class="alert alert-success d-none" role="alert"></div>

                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" name="username" id="username" autocomplete="off" data-1p-ignore placeholder="Username" />
                                    <button class="btn btn-primary" id="registerButton" type="button">
                                        <i class="bi bi-person-plus-fill me-1"></i> Register
                                    </button>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="preformattedMessages" class="form-label">Registration Output</label>
                                <div class="input-group">
                                    <textarea readonly class="form-control font-monospace" id="preformattedMessages" rows="4" style="resize: none;"></textarea>
                                    <button class="btn btn-outline-secondary" type="button" id="copyButton" title="Copy to clipboard">
                                        <i class="bi bi-clipboard"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="text-center">
                                <small class="text-muted">Already registered? <a href="/webauthn/login" class="text-decoration-none">Login</a></small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="/webauthn/static/js/bootstrap.bundle.min.js"></script>
        <script src="/webauthn/static/js/jquery.min.js"></script>
        <script src="/webauthn/static/js/site.js"></script>
        <script>
            $(document).ready(() => {
                if (browserCheck()) {
                    $('#username').keyup(function(e) {
                        if ($("#username").is(":focus") && event.key == "Enter") {
                            registerUser();
                        }
                    });
                    $('#registerButton').click(registerUser);

                    // Prepopulate the username field if specified
                    let queryString = window.location.search;
                    let urlParams = new URLSearchParams(queryString);
                    if (urlParams.has('default_username')) {
                        let username = urlParams.get('default_username');
                        $('#username').val(username);
                    }

                    // Set up copy-to-clipboard button
                    $('#copyButton').click(() => {
                        var preformattedMessagesArea = $('#preformattedMessages');
                        preformattedMessagesArea.select();
                        navigator.clipboard.writeText(preformattedMessagesArea.val());

                        // "Flash" it to indicate that the text was copied
                        preformattedMessagesArea.fadeOut(200).fadeIn(200);
                    });

                    // Set focus to the username field
                    $('#username').focus();
                }
            });
        </script>
    </body>
</html>
