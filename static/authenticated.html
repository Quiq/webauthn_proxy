<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>WebAuthn Proxy Authenticated</title>
        <link rel="icon" type="image/x-icon" href="/webauthn/static/favicon.ico" />
        <link href="/webauthn/static/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="/webauthn/static/css/bootstrap-icons.min.css">
    </head>
    <body>
        <!-- Theme Toggle -->
        <div class="position-fixed top-0 end-0 p-3" style="z-index: 1050;">
            <button class="btn btn-sm btn-outline-secondary" type="button" id="theme-toggle" title="Toggle theme">
                <i class="bi bi-sun-fill"></i>
            </button>
        </div>

        <!-- Main Content -->
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow">
                        <div class="card-body text-center">
                            <img src="/webauthn/static/title-image.png" class="img-fluid mb-4" alt="WebAuthn Proxy" style="max-width: 300px;" />
                            <div class="alert alert-success d-flex align-items-center justify-content-center" role="alert">
                                <i class="bi bi-check-circle-fill me-2"></i>
                                <span>Successfully Authenticated</span>
                            </div>
                            <a href="/webauthn/logout" class="btn btn-primary">
                                <i class="bi bi-box-arrow-right me-1"></i> Logout
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="/webauthn/static/js/bootstrap.bundle.min.js"></script>
        <script src="/webauthn/static/js/site.js"></script>
    </body>
</html>
