<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>WebAuthn Proxy Login</title>
        <link rel="icon" type="image/x-icon" href="/webauthn/static/favicon.ico" />
        <link href="/webauthn/static/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="/webauthn/static/css/bootstrap-icons.min.css">
    </head>
    <body>
        <!-- Theme Toggle -->
        <div class="position-fixed top-0 end-0 p-3" style="z-index: 1050;">
            <button class="btn btn-sm btn-outline-secondary" type="button" id="theme-toggle" title="Toggle theme">
                <i class="bi bi-sun-fill"></i>
            </button>
        </div>

        <!-- Main Content -->
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow">
                        <div class="card-body">
                            <div class="text-center mb-4">
                                <img src="/webauthn/static/title-image.png" class="img-fluid" alt="WebAuthn Proxy" style="max-width: 300px;" />
                            </div>

                            <div id="errorMessages" class="alert alert-danger d-none" role="alert"></div>
                            <div id="successMessages" class="alert alert-success d-none" role="alert"></div>

                            <div class="mb-3">
                                <label for="username" class="form-label">Authenticate</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" name="username" id="username" autocomplete="off" data-1p-ignore placeholder="Username" />
                                    <button class="btn btn-primary" id="loginButton" type="button">
                                        <i class="bi bi-box-arrow-in-right me-1"></i> Login
                                    </button>
                                </div>
                            </div>

                            <div class="text-center">
                                <small class="text-muted">A new user? <a href="#" id="registerLink" class="text-decoration-none">Register</a></small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="/webauthn/static/js/bootstrap.bundle.min.js"></script>
        <script src="/webauthn/static/js/jquery.min.js"></script>
        <script src="/webauthn/static/js/site.js"></script>
        <script>
            const registerLinkClick = (defaultUsername) => {
                let uri = "/webauthn/register";
                if (defaultUsername) {
                    uri = uri + `?default_username=${defaultUsername}`;
                }
                window.location.href = uri;
            };

            $(document).ready(() => {
                if (browserCheck()) {
                    $('#username').keyup(function(e) {
                        if ($("#username").is(":focus") && event.key == "Enter") {
                            authenticateUser();
                        }
                    });
                    $('#loginButton').click(authenticateUser);

                    // Prepopulate the username field if specified
                    let queryString = window.location.search;
                    let urlParams = new URLSearchParams(queryString);
                    let username = null;
                    if (urlParams.has('default_username')) {
                        username = urlParams.get('default_username');
                    } else {
                        let cookies = document.cookie.split(';');
                        for (let i = 0; i < cookies.length; i++) {
                            let parts = cookies[i].split('=');
                            if (parts[0].trim() === "webauthn-proxy-username") {
                                username = decodeURIComponent(parts[1]);
                                break;
                            }
                        }
                    }

                    // Set focus and value to the username field
                    $('#username').focus();
                    $('#username').val(username);

                    // Click handler for the "register" link
                    $('#registerLink').click(registerLinkClick.bind(registerLinkClick, username));
                }
            });
        </script>
    </body>
</html>
